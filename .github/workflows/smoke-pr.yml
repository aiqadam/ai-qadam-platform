name: smoke-pr

# Sprint 0.10 — browser-agent smoke tests (Lane 2 of 3-lane execution model).
# See docs/01-business/community-platform-roadmap.md §2.5 + §7.5.
#
# Runs Playwright tests against production (read-only assertions only) to
# validate a PR's behavior against current prod. No deploy race — the PR
# isn't deploying.
#
# ISS-CI-SMOKE-001 (2026-07-26): split out of the former single smoke.yml
# (later renamed smoke-probe.yml in #63) to work around a GitHub Actions
# platform bug: this repo's smoke workflow combined pull_request + schedule
# + workflow_dispatch in one file, and GitHub's server-side trigger
# registration for that exact combination got permanently stuck after the
# ISS-MIGRATE-001 repo migration (2026-07-08) — `workflow_dispatch` calls
# 422'd with "Workflow does not have 'workflow_dispatch' trigger" despite
# it being declared, and neither pull_request nor schedule ever fired a
# real run (confirmed against merged PRs showing no smoke check at all).
# Renaming the file (#63) did NOT fix it — the identical bug reproduced
# immediately under the new name, proving the problem is specific to the
# 3-trigger combination, not a one-off stuck registration. Two other
# workflows in this repo already prove 2-trigger combos work fine:
# content-quality.yml (pull_request + workflow_dispatch) and
# parity-check.yml (schedule + workflow_dispatch). This split follows
# that proven pattern. See github.com/orgs/community/discussions/174544
# and /200691 for matching unresolved community reports of this class of
# GitHub bug.
#
# smoke-schedule.yml (the other half of that split — schedule +
# workflow_dispatch, a 30-min prod-probe cron) was removed 2026-07-26.
# It was designed around Coolify's async auto-deploy racing a push-
# triggered smoke run; Coolify was removed 2026-07-23 (#45) and replaced
# with an SSH deploy that already health-checks inline. The cron also
# never actually fired a real run due to the trigger bug above. See
# apps/e2e/README.md's "History" section for the full rationale, including
# the still-open gap (non-deploy prod breakage) and Gatus as the better
# tool for that job if it's ever needed.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch: {}

concurrency:
  group: smoke-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: apps/e2e
        env:
          BASE_URL: ${{ vars.SMOKE_BASE_URL || 'https://aiqadam.org' }}
          CI: "true"
        run: pnpm test:e2e:smoke

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/e2e/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces (failures only)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ github.run_id }}
          path: apps/e2e/test-results/
          retention-days: 7
