# ─── Source ──────────────────────────────────────────────────────────────────

requirement_ref: "ISS-ADM-010-1"
requirement_text: >
  Forced password-change attribute does not actually force a password-change
  screen. AdminBootstrapService.seedAdmin() sets
  ak_login_password_change_required: true on the seeded bootstrap admin, but
  live verification shows the attribute has no observable effect on the login
  flow — the flow executor returns xak-flow-redirect straight to /application/o/authorize/...
  with no intermediate password-change stage. The fix is to bind a password-expiry
  policy + ensure the default-authentication-flow includes a stage that consults it,
  so the seeded password is pre-expired at creation time.
github_issue_url: "https://github.com/aiqadam/ai-qadam-platform/issues/164"

