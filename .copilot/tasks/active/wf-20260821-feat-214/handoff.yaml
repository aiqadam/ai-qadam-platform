requirement_ref: "FR-CMS-009"
requirement_text: >
  `apps/web-next/src/lib/cms.ts` hardcodes the public Directus origin as
  a module constant:

      const PUBLIC_DIRECTUS_URL = 'https://cms.aiqadam.org';   // L14

  It has exactly two consumers (both in the same file): `directusBase()`
  returns it on the client side (L30), and `publicAssetUrl()` builds
  browser-facing asset URLs from it (L875) — the latter added by
  FR-CMS-008 for the /rules source-document download links.

  Because the value is hardcoded to the PRODUCTION hostname with no
  environment override, any non-production deployment emits
  browser-facing links pointing at production. Verified live 2026-08-21
  on QA: the rendered download href would be
  `https://cms.aiqadam.org/assets/<id>?download` regardless of
  environment, and there is no QA Directus vhost at all
  (`cms.qa.aiqadam.org` and `directus.qa.aiqadam.org` do not resolve;
  `cms.aiqadam.org` itself currently returns 523). This makes the
  FR-CMS-008 feature unverifiable and non-functional on QA, and blocked
  infra task T-0141 before it touched anything.

  Make the public Directus origin environment-configurable:
  - Read it from an environment variable (name it consistently with this
    codebase's existing conventions — check how other public/browser-
    facing URLs are configured in apps/web-next before choosing; do NOT
    invent a novel pattern if one exists).
  - Default to the current production value (`https://cms.aiqadam.org`)
    when unset, so production behavior is byte-identical and no
    production deploy config change is required by this PR.
  - Astro exposes build-time public env vars with a specific prefix
    convention — confirm the actual mechanism this project uses
    (`import.meta.env` vs `process.env`, and whether the value is needed
    at build time, SSR time, or both) rather than assuming, since
    `publicAssetUrl()` is called during SSR (the page is
    `prerender = false`) while `directusBase()`'s client branch may run
    in the browser.
  - Update `.env.example` and any deploy/docs reference so a future
    environment knows the knob exists.

  Scope note: this changes ONLY how the public origin is resolved. Do not
  alter `DEFAULT_INTERNAL_DIRECTUS_URL` / the server-side
  `INTERNAL_DIRECTUS_URL` path — that half is correct and load-bearing
  for SSR fetch performance. Do not change `assetUrl()`'s behavior for
  its existing callers.

  Known related gap, explicitly OUT of scope for this PR (infra, not
  code): QA has no Directus vhost, so even after this change an operator
  must expose QA's Directus at a QA hostname and set the new env var
  accordingly. That is tracked separately on the infra side alongside
  T-0141.

