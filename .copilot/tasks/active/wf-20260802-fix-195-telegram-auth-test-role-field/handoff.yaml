scope:
  description: |
    Fix the 3 pre-existing `toEqual()` assertion failures in
    `apps/api/test/telegram-auth-service.spec.ts` (lines 371, 384, 402)
    that were broken by FR-BOT-003 (PR #220, commit `639467b`) when it
    added the `role` field to `TelegramAuthService.lookupUser()`'s
    response. Verify the full apps/api test suite passes; verify the
    ci-cd build is green.
  files_to_modify:
    - apps/api/test/telegram-auth-service.spec.ts

retry_limits:
  code-developer: 2
  test-runner: 2
  pr-steward:
    override-max-consecutive: 5
