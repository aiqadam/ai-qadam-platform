requirement_ref: "FR-ADM-011"
requirement_text: >
  Generalize /workspace/admin/users from invite-list-only (FR-ADM-005) into a
  full user/role management screen: super-admins search any existing user,
  view current role(s) in plain language, grant/revoke roles via form
  controls, with a mandatory live re-read of Authentik group membership
  after every change (closing the GitHub issue #107 silent-failure gap),
  enforcing the ADR-0021 <=3-super-admin cap as a shared, reusable check
  with FR-ADM-010's bootstrap-time cap logic.
