requirement_text: >-
  OIDC callback rejects with 401 "oidc id_token missing email claim" after
  a user registers and signs in. Root cause: .copilot/bootstrap-oidc.sh
  creates the Authentik OAuth2/OIDC provider without property_mappings,
  so no scope mappings are attached and the id_token never carries email.
