requirement_ref: "ISS-USR-REG-003"
requirement_text: >-
  SignUpForm.tsx (apps/web-next) native form submission arrives at the
  server with all real fields (displayName/email/password/country) missing
  — only the honeypot `company` field survives — for any submission
  triggered by a genuine user interaction (button click, Enter key). Root
  cause: disabled={phase === 'submitting'} on all fields, combined with
  setPhase('submitting') called synchronously in onSubmit, causes React to
  disable the fields via a synchronous re-render that completes before the
  browser finalizes the native form's entry list (disabled controls are
  excluded per the WHATWG form-submission algorithm). Reported as GitHub
  issue #58.
github_issue_url: "https://github.com/aiqadam/ai-qadam-platform/issues/58"

