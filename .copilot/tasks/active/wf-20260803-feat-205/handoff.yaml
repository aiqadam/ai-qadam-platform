notes: |
  FR-NTF-005: User notification preferences and topic interests
  
  Implementing notification channel toggles and topic interests for members.
  
  Key components:
  1. New fields on directus_users: notification_email_enabled, notification_telegram_enabled, country_preference, telegram_id
  2. Topic interests table: user_interests (user FK, topic FK, created_at)
  3. Web preferences page: /me/preferences with channel toggles and topic checklist
  4. Bot /interests command: inline keyboard for topic selection
  5. API endpoints: GET/PATCH /v1/me/preferences/consents, POST/DELETE /v1/me/profile/interests/:id
  
  Dependencies: FR-EVT-007 (topic catalog), FR-USR-004 (preferences page), FR-NTF-002 (fan-out notifications)

