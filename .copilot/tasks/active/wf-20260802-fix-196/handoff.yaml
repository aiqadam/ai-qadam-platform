requirement_ref: "FR-CRM-002"
requirement_text: >
  GitHub issue #129 asked to implement FR-CRM-002 (sync members to Twenty
  CRM as Person records). Investigation found ADR-0033 (Accepted,
  2026-05-20) formally retired Twenty CRM in favor of the Directus member
  graph, and FR-AUTH-006 already documents the directus_users row as the
  modern replacement for CRM sync. Building FR-CRM-002 as literally spec'd
  would resurrect a dead dependency and contradict current architecture.
  User confirmed (2026-08-02): close as superseded, no code.
