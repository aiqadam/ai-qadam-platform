notes: >-
  Discovered during wf-20260728-fix-139's Step 2 impact analysis while
  investigating GitHub issue #89 (post-signup redirect). Originally
  hypothesized the root cause was a missing redirect stage on Authentik's
  default-recovery-flow. Deeper investigation (live curl/fetch against
  aiqadam-authentik-server) found a more direct and more severe bug
  first: createRecoveryLink() reads res.recovery_link, but Authentik's
  real response field is res.link — always returned undefined in
  production, silently breaking both the welcome-email path AND Telegram
  Login-Widget sign-in. Fixed that (one-line + test mock correction).
  Then live-verified the FULL flow via Playwright and discovered the
  original redirect-stage hypothesis, even if implemented, would not
  have delivered a working one-click sign-in — Authentik's recovery link
  still prompts for email re-entry, it is not a one-time-login token.
  A redirect stage was applied live to test this, confirmed insufficient,
  and reverted (live Authentik state restored to baseline). The larger
  design question (what should the welcome-email link's login mechanism
  actually be) was split off to ISS-USR-REDIRECT-003, filed as open and
  unscheduled pending product/design input, per AGENTS.md §13 (surfaced
  to the user rather than decided unilaterally) and confirmed in-chat.
