requirement_ref: "ISS-RBAC-PERMS-001"
requirement_text: |
  Implement directus_permissions rows for the remaining 5 ADR-0021 §4.1
  RBAC policies: policy.sponsor_rep, policy.organizer, policy.country_lead,
  policy.svc_bot, policy.svc_worker. policy.member and policy.speaker were
  completed in wf-20260730-fix-160 (PR TBD) — see ISS-RBAC-PERMS-001.md's
  2026-07-30 update for the exact grants shipped, 3 real Directus-behavior
  bugs found and fixed along the way (worth re-reading before starting:
  $CURRENT_USER dotted-key filters 400, `permissions` has zero effect on
  `create`, `validation` can't traverse a relational FK), and 2 new issues
  split off (ISS-RBAC-ONBOARDED-AT-001, ISS-SEC-PUBLIC-UNMANAGED-001) that
  are unrelated to this follow-up's scope but worth being aware of.

  Suggested Approach items 3-7 in ISS-RBAC-PERMS-001.md remain accurate:
  3. policy.sponsor_rep — CONFIRMED with user 2026-07-31: implement
     against `sponsors.rep_user` (the real FK to directus_users used for
     cabinet-login gating), NOT `companies.rep_user` (referenced by
     ADR-0021 §4.2 and the existing policy.sponsor_rep description in
     bootstrap.sh, but that field does not exist anywhere in the schema
     — companies is a separate cohort/entitlement primitive with no
     rep-linking field). Read own org's sponsors row + event_sponsors
     rows scoped via sponsor.rep_user == $CURRENT_USER. The
     partner_audiences/cohort-entitlement half (which links to
     companies, not sponsors) is out of scope for this slice pending
     further reconciliation of the sponsors/companies relationship —
     note this explicitly rather than guessing a link that doesn't
     exist.
  4. policy.organizer — CRUD events/registrations/event_speakers scoped
     to country via directus_users.country_code; PII fields gated on
     opt-in flag per the PII data-flow doc referenced in ADR-0021 §3.
  5. policy.country_lead — organizer permissions + roster management +
     sponsor pipeline + PII.
  6. policy.svc_bot — read all events, write registrations.checked_in_at,
     read point_awards; no PII except telegram_user_id.
  7. policy.svc_worker — CRUD interactions/interaction_deliveries/
     interaction_responses; no registration writes.

  Given the size (multi-collection, country-scoped dynamic filters,
  2 distinct service-account policies with different semantics), size
  this out further into 2-3 PRs rather than one — matches the pattern
  wf-20260730-fix-160 itself used relative to wf-20260728-fix-144.
