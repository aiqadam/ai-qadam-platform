requirement_ref: ""
requirement_text: |
  Replace the current ad hoc, script-driven admin/RBAC bootstrap
  (super-admin status granted only via one-off scripts touching Authentik
  groups and/or Directus policies directly, with no UI, no self-service,
  and demonstrably unreliable — see 00a-investigation-issue-107.md /
  00b-scope-correction.md in this task dir for the concrete failure that
  triggered this) with a proper, in-product admin/RBAC subsystem:
    1. System bootstraps with a seeded initial admin account (e.g. username
       `admin`, a known simple default password) that MUST force a password
       change on first login.
    2. A standard, understandable roles/groups/permissions model, replacing
       or fronting the current split Authentik-groups / Postgres-enum /
       Directus-policies mechanism with one coherent model.
    3. Admins manage users and their access (grant/revoke roles, invite,
       deactivate) entirely through a normal admin-panel screen/form in the
       product UI — not scripts, not direct Authentik/Directus console
       access.
  Originated from GitHub issue #107 ("There is no admin panel") but
  supersedes its literal text — investigation found the existing
  /workspace/admin/* surface already covers tenant provisioning and
  operator invites, but is unreachable/unmanageable except via scripts
  that have proven unreliable (reporting user still not recognized as
  super-admin after a script claimed to grant it). The real gap is the
  bootstrap/RBAC-management mechanism itself, not the admin screens.
github_issue_url: "https://github.com/aiqadam/ai-qadam-platform/issues/107"

