# Why this exists
# PR #229 (squash 6a26a1e, predecessor wf-20260801-fix-190) shipped a
# 'cleaner PATCH' but did not actually fix the AC. Authentik 2024.12.3
# silently ignores the `password_change_next_login: true` field on
# PATCH /api/v3/core/users/{pk}/ -- the PATCH returns HTTP 200 but the
# field is a no-op. The User model has no such attribute, the OPTIONS
# schema doesn't list it, and the flow executor still returns
# `xak-flow-redirect` straight to OIDC with no password-change stage.
# Same MISMATCH as the original discovery. ISS-ADM-010-1 reopened.

# Candidate fix paths (ImpactAnalyzer picks one at Step 2)
#   (a) Trigger the `default-password-change` recovery flow's email magic-link
#       on bootstrap so the admin must complete the password-change flow
#       before they can sign in normally. Pure 2024.12.3 mechanism.
#   (b) Upgrade Authentik to a 2025.x build that supports ForcePasswordChange
#       on the user body. Requires infrastructure change + version-bump
#       ADR.

