requirement_ref: "ISS-USR-REDIRECT-002"
requirement_text: >-
  Self-registration welcome-email one-time login link (Authentik
  recovery link) does not re-enter the app's OIDC flow. Authentik's
  default-recovery-flow has no login/redirect stage bound to it, and
  createRecoveryLink() mints the link with no next/redirect target.
  New members clicking the welcome-email link never reach /v1/auth/callback
  or /me — they land back in Authentik's own recovery-email prompt.
