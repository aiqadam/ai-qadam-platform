notes: >-
  Discovered during wf-20260728-fix-139's Step 2 impact analysis while
  investigating GitHub issue #89 (post-signup redirect). Confirmed live
  against aiqadam-authentik-server: default-recovery-flow stages are
  aiqadam-recovery-identification (ak-stage-identification-form) and
  aiqadam-recovery-email (ak-stage-email-form) only — no login stage,
  no redirect. User explicitly requested (2026-07-28, in-chat) that this
  be fixed in the same session as ISS-USR-REDIRECT-001, sequenced as a
  second PR rather than bundled into one (AGENTS.md §4 small-PR rule).
  Two candidate fixes to evaluate: (1) bind a login+redirect stage to the
  recovery flow so consuming the link lands back in the app's OIDC
  authorize endpoint; (2) change registration.service.ts's welcome email
  to route through /v1/auth/login?next=/me instead of a bare Authentik
  recovery link. See ISS-USR-REDIRECT-002.md for full detail.
