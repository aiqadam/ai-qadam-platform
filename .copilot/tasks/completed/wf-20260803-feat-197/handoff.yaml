# ─── Source ──────────────────────────────────────────────────────────────────

requirement_ref: "FR-NTF-004"
requirement_text: >
  Implement GitHub issue #142 (FR-NTF-004, Telegram notification channel
  adapter) as a gap-fill against the ALREADY-SHIPPED ADR-0034 architecture,
  not a literal re-read of the FR/issue text. Pre-workflow investigation
  (this session, before Step 0) found the issue text describes an
  architecture that conflicts with what's live: it says the NestJS API
  should call the Telegram Bot API directly, using "the existing BullMQ
  outbox/dispatcher rate limiter," keyed on Authentik
  attributes.telegram_id + notification_telegram_enabled, logging to a
  notifications_sent table. None of that exists. What's actually shipped
  (ADR-0034, accepted 2026-07-31): apps/api/src/modules/interactions/
  channels/telegram-adapter.ts (TelegramAdapter) already writes a
  tg.dispatch.v1 envelope to a Postgres outbox; a relay XADDs to Redis
  Streams; a separate Python notifier process (apps/bot submodule) is the
  ONLY thing that calls the real Telegram Bot API and owns rate limiting
  there. Eligibility already reads directus_users.telegram_user_id /
  telegram_opted_out_at (not Authentik attributes). The user was asked
  and confirmed (AskUserQuestion, this session): "Gap-fill the real
  adapter" — treat the existing TelegramAdapter as the correct
  implementation, correct FR-NTF-004.md's text to match reality (same
  disposition precedent as FR-CRM-002/ADR-0033), and implement only the
  genuinely missing pieces found by direct investigation:

  1. TelegramAdapter silently drops `inline_buttons` from the dispatch
     payload — payloadSchema (telegram-adapter.ts) only declares text/
     parse_mode/disable_web_page_preview, and the envelope hardcodes
     `inline_buttons: null` regardless of input. This is a real,
     reproducible bug: apps/api/src/modules/workspace/event-reminders.service.ts
     `buildReminderPayload()` ALREADY constructs an `inline_buttons` array
     (e.g. `[[{ text: '📖 Details', url }]]`) expecting it to reach
     Telegram — it never does. Fix: extend payloadSchema to accept and
     pass through inline_buttons into the envelope's template.inline_buttons
     field (currently hardcoded null).
  2. Registration-confirmed / registration-waitlisted / registration-promoted
     notifications never reach Telegram at all — the three Directus flows
     in infrastructure/directus/flows-bootstrap.sh (capacity_email_confirmed,
     capacity_email_waitlisted, capacity_email_confirmed's promotion
     counterpart around line ~444) call POST /v1/internal/interactions/dispatch
     with `"allowedChannels": ["email"]` hardcoded — Telegram is
     structurally excluded even for telegram-linked, opted-in members.
     This is the FR's stated AC ("registration confirmation DM includes
     an Open event page inline button") and it is currently unreachable.
     Fix: add Telegram-safe HTML body + inline "Open event page" button
     content for these 3 intents (mirroring the existing pattern in
     event-reminders.service.ts's buildReminderPayload/telegramHtmlBody),
     and change allowedChannels to include 'telegram' (multi-channel
     dispatch — both email AND telegram, not a fallback chain per
     interactions.types.ts's documented Phase deferral of fallback
     chains). Promotion-from-waitlist gets the same treatment per the
     FR's AC.
  3. Telegram-safe HTML enforcement — FR-NTF-004 functional scope item 3
     requires templates rendered as a Telegram-safe HTML subset (<b> <i>
     <u> <s> <a> <code> <pre>) with unsupported tags stripped on send.
     No such stripping/validation exists today anywhere in the dispatch
     path — the adapter trusts `text` as already-safe. Add a small
     sanitizer (allowlist-tag-strip, not a full HTML parser dependency)
     applied in TelegramAdapter before the envelope is built, so ANY
     caller (not just the 2 call sites touched above) gets the safety
     guarantee the FR requires.
  4. Documentation correction: FR-NTF-004.md's functional-scope text
     currently describes the wrong architecture (direct Telegram API call
     from NestJS, Authentik telegram_id, BullMQ, notifications_sent). Correct
     it to describe the real shipped mechanism (outbox → Streams →
     notifier), matching the FR-CRM-002/ADR-0033 precedent for correcting
     FR text against a since-established architectural decision. Do NOT
     silently leave the stale text in place.

  Explicitly OUT of scope for this workflow (do not build): BullMQ in any
  form, NestJS calling the real Telegram Bot API directly, an Authentik
  attributes.telegram_id lookup path, a new notifications_sent table
  (interaction_deliveries + tg_send_log already serve this purpose),
  building the Python notifier's actual sendMessage/rate-limit code in
  apps/bot (that is the notifier's own, separately-scoped, not-yet-built
  piece — flag as a known gap in FR-NTF-004.md's Notes, do not silently
  invent it here; a message with a valid envelope in the outbox is as far
  as the NestJS side of this FR can verify without that piece existing).
  FR-AUTH-005 (Authentik-agnostic Telegram account LINKING) is a separate,
  still-Planned FR — do not implement it here; this workflow's eligibility
  check continues to use the already-shipped directus_users.telegram_user_id/
  telegram_opted_out_at fields exactly as InteractionsService.resolveRecipients
  already does.
github_issue_url: "https://github.com/aiqadam/ai-qadam-platform/issues/142"

