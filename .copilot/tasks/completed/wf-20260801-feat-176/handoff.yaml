requirement_text: >
  PR 3/6 of FR-BOT-002 (Bot member commands): implement /me for the
  Telegram bot. Aggregates registrations (RegistrationsDirectusService.listMine
  via the existing directusUserId -> platform users.id bridge), points total
  (new single-user variant of PointsDirectusService.leaderboard's own
  aggregation query), and account type (temp/full, already available on the
  bot's own UserContext from AuthMiddleware — no new API call needed). Streak
  is explicitly omitted — no streak concept, column, or calculation exists
  anywhere in this codebase, and none of FR-BOT-002's ACs test it; documented
  as a scope gap, not silently dropped or fabricated. "Link Telegram to web"
  CTA resolved as a generic always-shown CTA — the old-module concept of
  directus_users.telegram_user_id/telegram_linked_at (ADR-0033) belongs to a
  different, superseded auth surface (apps/api/src/modules/telegram/, pre-
  ADR-0034) and reading it from the new bot's identity model would conflate
  two unrelated auth systems for a non-AC-tested nicety.
